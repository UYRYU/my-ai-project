# BTC Trend Long Bot - Settings
# ============================

data:
  symbol: "BTCUSDT"
  timeframes:
    - "5m"
    - "15m"
    - "1h"
    - "4h"
  data_dir: "data/raw"
  processed_dir: "data/processed"
  timezone: "UTC"

backtest:
  initial_capital: 10000.0
  commission_pct: 0.04  # 0.04% taker fee (Binance level)
  slippage_pct: 0.02    # 0.02% slippage
  position_size_pct: 95.0  # % of capital per trade
  max_open_trades: 1
  leverage: 1  # default spot, change for leverage
  default_timeframe: "1h"

trend_detection:
  # EMA-based
  ema_fast: 50
  ema_slow: 200
  # ADX
  adx_period: 14
  adx_threshold: 25
  # Higher highs / higher lows
  hh_hl_lookback: 20
  # Volume
  volume_sma_period: 20
  volume_increase_ratio: 1.2
  # Volatility floor
  atr_period: 14
  min_atr_pct: 0.5  # minimum ATR as % of price
  # Anti-FOMO: skip if price too extended
  max_distance_from_ema200_pct: 15.0

bull_run_extraction:
  min_duration_days: 30
  min_return_pct: 20.0
  ema_above_ratio: 0.7  # 70%+ of time above 200EMA
  output_file: "data/processed/bull_runs.csv"

strategies:
  pullback:
    ema_fast: 20
    ema_period: 50
    atr_sl_mult: 2.0
    rsi_period: 14
    rsi_oversold: 45
    rsi_recovery: 55
    volume_confirm: true

  breakout:
    lookback: 20
    volume_mult: 1.2
    atr_breakout_min: 0.5
    consolidation_bars: 5
    false_breakout_filter: true

  reacceleration:
    squeeze_period: 20
    adx_rise_bars: 3
    adx_min: 20
    range_break_lookback: 10
    bb_period: 20
    bb_std: 2.0
    kc_period: 20
    kc_mult: 1.5

  multi_timeframe:
    higher_tf: "4h"
    entry_tf: "15m"
    alignment_required: true

exit:
  methods:
    - "fixed_rr"
    - "atr_trailing"
    - "swing_low"
    - "ema_break"
    - "partial_trail"
    - "volume_fade"

  fixed_rr_ratios: [2.0, 3.0, 5.0]

  atr_trailing:
    multiplier: 2.5
    warmup_bars: 5

  swing_low:
    lookback: 5

  ema_break:
    period: 20

  partial_trail:
    first_tp_rr: 1.5
    first_tp_pct: 50.0
    trail_atr_mult: 2.0

  volume_fade:
    lookback: 10
    fade_ratio: 0.5

  stoploss:
    methods: ["atr", "swing_low", "time_based"]
    atr_mult: 1.5
    time_limit_bars: 50
    breakeven_after_rr: 1.0
    breakeven_enabled: true

optimization:
  n_trials: 200
  train_ratio: 0.6
  validation_ratio: 0.2
  test_ratio: 0.2
  objective: "calmar_ratio"
  use_bull_periods_only: false
  walk_forward:
    enabled: true
    n_splits: 5
    train_pct: 70

reports:
  output_dir: "reports"
  save_equity_curve: true
  save_trade_log: true
  top_n_strategies: 5
  top_trades_n: 10
