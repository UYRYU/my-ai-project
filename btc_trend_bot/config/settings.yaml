# BTC Trend Long Bot - Settings
# ============================

data:
  symbol: "BTCUSDT"
  timeframes:
    - "5m"
    - "15m"
    - "1h"
    - "4h"
  data_dir: "data/raw"
  processed_dir: "data/processed"
  timezone: "UTC"

# -----------------------------------------------------------
# Exchange configuration (Bitget)
# -----------------------------------------------------------
exchange:
  name: "bitget"
  api_key: ""       # set via .env or environment variable
  api_secret: ""
  passphrase: ""
  testnet: true
  base_url: "https://api.bitget.com"

  # Fee structure (Bitget spot, VIP0)
  maker_fee_pct: 0.02    # 0.02%
  taker_fee_pct: 0.06    # 0.06%
  slippage_bps: 5.0      # 5 basis points

  # Order constraints
  min_order_size_btc: 0.0001
  max_leverage: 20

  # Risk per trade
  risk_per_trade_pct: 2.0

# -----------------------------------------------------------
# Backtest
# -----------------------------------------------------------
backtest:
  initial_capital: 10000.0
  commission_pct: 0.06    # Bitget taker fee
  slippage_pct: 0.05      # 5 bps
  position_size_pct: 95.0
  max_open_trades: 1
  leverage: 1
  default_timeframe: "1h"

# -----------------------------------------------------------
# Trend detection
# -----------------------------------------------------------
trend_detection:
  ema_fast: 50
  ema_slow: 200
  adx_period: 14
  adx_threshold: 25
  hh_hl_lookback: 20
  volume_sma_period: 20
  volume_increase_ratio: 1.2
  atr_period: 14
  min_atr_pct: 0.5
  max_distance_from_ema200_pct: 15.0

# -----------------------------------------------------------
# Bull run extraction
# -----------------------------------------------------------
bull_run_extraction:
  min_duration_days: 30
  min_return_pct: 20.0
  ema_above_ratio: 0.7
  output_file: "data/processed/bull_runs.csv"

# -----------------------------------------------------------
# Strategies (original + strict variants)
# -----------------------------------------------------------
strategies:
  # --- Original ---
  pullback:
    ema_fast: 20
    ema_period: 50
    atr_sl_mult: 2.0
    rsi_oversold: 45
    rsi_recovery: 55

  breakout:
    lookback: 20
    volume_mult: 1.2
    consolidation_bars: 5
    consolidation_atr_pct: 0.85

  reacceleration:
    adx_rise_bars: 3
    adx_min: 20
    range_break_lookback: 10

  multi_timeframe:
    higher_tf: "4h"
    entry_tf: "15m"
    alignment_required: true

  # --- Strict (real-data optimized) ---
  pullback_strict:
    rsi_oversold: 48
    rsi_recovery: 55
    anti_fomo_pct: 8.0
    anti_fomo_bars: 20
    trend_strength_min: 0.5
    atr_sl_mult: 2.0

  breakout_confirmed:
    lookback: 20
    volume_mult: 1.3
    adx_min: 22
    bar_strength_min: 0.7
    cooldown_bars: 5
    atr_sl_mult: 2.5

  reacceleration_quality:
    squeeze_lookback: 5
    adx_rise_bars: 3
    adx_min: 20
    trend_strength_min: 0.4
    range_break_pct: 0.5
    atr_sl_mult: 2.0
    pre_trend_bars: 20

  multi_tf_trend_hold:
    trend_strength_min: 0.5
    rsi_min: 45
    rsi_max: 70
    adx_min: 20
    max_extension_pct: 12.0
    cooldown_bars: 10
    atr_sl_mult: 2.5

# -----------------------------------------------------------
# Exit methods
# -----------------------------------------------------------
exit:
  methods:
    - "fixed_rr"
    - "atr_trailing"
    - "swing_low"
    - "ema_break"
    - "partial_trail"
    - "volume_fade"

  fixed_rr_ratios: [2.0, 3.0, 5.0]

  atr_trailing:
    multiplier: 2.5
    warmup_bars: 5

  swing_low:
    lookback: 5

  ema_break:
    period: 20

  partial_trail:
    first_tp_rr: 1.5
    first_tp_pct: 50.0
    trail_atr_mult: 2.0

  volume_fade:
    lookback: 10
    fade_ratio: 0.5

  stoploss:
    methods: ["atr", "swing_low", "time_based"]
    atr_mult: 1.5
    time_limit_bars: 50
    breakeven_after_rr: 1.0
    breakeven_enabled: true

# -----------------------------------------------------------
# Optimization
# -----------------------------------------------------------
optimization:
  n_trials: 200
  train_ratio: 0.6
  validation_ratio: 0.2
  test_ratio: 0.2
  objective: "calmar_ratio"
  use_bull_periods_only: false
  walk_forward:
    enabled: true
    n_splits: 5
    train_pct: 70

# -----------------------------------------------------------
# Reports
# -----------------------------------------------------------
reports:
  output_dir: "reports"
  real_data_dir: "reports/real_data"
  save_equity_curve: true
  save_trade_log: true
  top_n_strategies: 5
  top_trades_n: 10

# -----------------------------------------------------------
# Paper trading
# -----------------------------------------------------------
paper_trading:
  symbol: "BTCUSDT"
  timeframe: "1h"
  initial_capital: 10000.0
  risk_per_trade_pct: 2.0
  max_drawdown_pct: 15.0
  max_daily_loss_pct: 5.0
  max_open_positions: 1
  taker_fee_pct: 0.06
  state_file: "data/paper_state.json"
  enabled_strategies:
    - "pullback_strict"
    - "breakout_confirmed"
    - "reacceleration_quality"
    - "multi_tf_trend_hold"
