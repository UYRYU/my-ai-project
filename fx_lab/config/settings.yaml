symbols:
  - USDJPY
  - EURJPY
  - GBPJPY

timeframes:
  - M1
  - M5

initial_balance: 100000

# === コスト前提 ===
# デフォルト: リテール口座 (従来互換)
spread: 0.02              # 2pips (リテール)
commission: 0.005          # 片道0.5pips (リテール)

# ECN口座前提 (--scalp-ecn で使用)
ecn:
  spread: 0.003            # 0.3pips
  commission: 0.0025       # 片道0.25pips (往復0.5pips)
  # 合計コスト: 0.3 + 0.5 = 0.8pips/trade

ranking_filters:
  min_pf: 1.2
  max_drawdown_pct: 15.0
  min_trades: 100

data_dir: "data/raw"

# MT4/MT5エクスポート元ディレクトリ (任意)
# ここにMT4/MT5のCSVを置けば自動変換される
mt_import_dir: "data/mt_import"

results_dir: "results"
strategies_dir: "strategies/generated"
strategies_dir_base: "strategies"

research:
  rounds: 5
  strategies_per_round: 60
  top_k: 10
  approved_pf: 1.35
  approved_max_dd: 0.12
  min_trades: 100

  # IS/OOS分割比率 (IS=70%, OOS=30%)
  is_ratio: 0.7

  # Walk-Forward窓数
  wf_windows: 3

# 深掘り探索 (--explore) 用フィルタ
exploration:
  min_pf: 1.00
  max_dd_pct: 20.0
  min_trades: 300
